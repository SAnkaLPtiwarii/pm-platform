name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pm_user
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: pm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm_user -d pm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pm_user:change_me@localhost:5432/pm_test
      TEST_DATABASE_URL: postgresql+psycopg://pm_user:change_me@localhost:5432/pm_test
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Check that the models and the migrations are in sync
        run: alembic check

      - name: Run unit and API tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker (build images and smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test the running stack
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health
          echo
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -X POST http://localhost:8000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","name":"CI","password":"Passw0rd!123"}'
          echo
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"Passw0rd!123"}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          curl -fsS http://localhost:8000/api/v1/dashboard/stats \
            -H "Authorization: Bearer $TOKEN"
          echo

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
